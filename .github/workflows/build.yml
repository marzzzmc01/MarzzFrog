
name: Build Marzz Client Fabric JAR

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP and Detect Project
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::ZIP source tidak ditemukan"
            exit 1
          fi

          echo "Source: $ZIP_FILE"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          BUILD_FILE="$(find project -type f \
            \( -name build.gradle -o -name build.gradle.kts \) \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::Gradle build file tidak ditemukan"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project ditemukan: $PROJECT_DIR"

      - name: Compile Fabric Mod
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi

      - name: Upload Fabric JAR
        uses: actions/upload-artifact@v4
        with:
          name: Marzz-Client-Fabric-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
