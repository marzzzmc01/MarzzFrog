name: Build Marzz Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find and Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname '*.zip' -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Source ZIP not found in the repository."
            echo "Files currently present:"
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "Found source ZIP: $ZIP_FILE"
          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          if [ -f "project/marzz-client/build.gradle" ] || [ -f "project/marzz-client/build.gradle.kts" ]; then
            PROJECT_DIR="project/marzz-client"
          elif [ -f "project/build.gradle" ] || [ -f "project/build.gradle.kts" ]; then
            PROJECT_DIR="project"
          else
            BUILD_FILE="$(find project -type f \\( -name 'build.gradle' -o -name 'build.gradle.kts' \\) -print -quit)"
            if [ -z "$BUILD_FILE" ]; then
              echo "::error::Could not find build.gradle or build.gradle.kts after extracting the ZIP."
              echo "Extracted files:"
              find project -maxdepth 5 -type f -print
              exit 1
            fi
            PROJECT_DIR="$(dirname "$BUILD_FILE")"
          fi

          echo "Gradle project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" build --no-daemon
          else
            gradle -p "$PROJECT_DIR" build --no-daemon
          fi

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Marzz-Client-Full-Storage-ESP
          path: project/**/build/libs/*.jar
          if-no-files-found: error
