
name: Build Marzz Client

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find and Extract Source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find . -type f -iname '*.zip' \
            -not -path './.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::File ZIP source tidak ditemukan."
            find . -maxdepth 4 -type f -print
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP_FILE"

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

          BUILD_FILE="$(find project -type f \
            \( -name 'build.gradle' -o -name 'build.gradle.kts' \) \
            -print -quit)"

          if [ -z "$BUILD_FILE" ]; then
            echo "::error::build.gradle tidak ditemukan."
            find project -maxdepth 6 -type f -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$BUILD_FILE")"

          echo "Folder project: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build JAR
        shell: bash
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean build --no-daemon
          else
            gradle clean build --no-daemon
          fi

      - name: Show Build Results
        shell: bash
        run: |
          echo "Hasil build:"
          find "$PROJECT_DIR/build/libs" \
            -maxdepth 1 -type f -name '*.jar' -print

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Marzz-Client-Full-Storage-ESP
          path: ${{ env.PROJECT_DIR }}/build/libs/*.jar
          if-no-files-found: error

         
